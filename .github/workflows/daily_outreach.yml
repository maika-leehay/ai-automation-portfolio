name: Daily Autonomous Outreach Engine

on:
  schedule:
    # Runs at 08:00 UTC (09:00 AM Central Europe) Monday through Friday
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python Dependencies
        run: |
          pip install -r ai_outreach_pipeline/requirements.txt

      - name: Write Google Credentials (if provided)
        run: |
          if [ -n "${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}" ]; then
            echo "${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}" > credentials.json
          elif [ -n "${{ secrets.GOOGLE_CREDENTIALS }}" ]; then
            echo "${{ secrets.GOOGLE_CREDENTIALS }}" > credentials.json
          fi

      - name: Execute Daily Scrape & Outreach
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          python ai_outreach_pipeline/main.py
